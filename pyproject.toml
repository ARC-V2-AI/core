[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-v2-core"
version = "0.6.0"
description = "The operating core of ARC V2: a Linux-native foundation for service installation, supervision, lifecycle management, and execution."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "arc-v2-service-runner @ git+https://github.com/ARC-V2-AI/service-runner.git",
    "arc-v2-util",
    "cyclopts>=4.22.5",
    "packaging>=26.3",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomli>=2.4.1",
    "tomli-w>=1.2.0",
    "typing-extensions>=4.16.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
arc = "arc.cli.main:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/arc"]

[tool.basedpyright]
reportAny = false
reportExplicitAny = false

authors = [{ name = "Paul" }]

keywords = [
    "ai",
    "local-ai",
    "operating-environment",
    "service-orchestration",
    "service-supervision",
    "runtime",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]

[tool.uv.sources]
arc-v2-util = { git = "https://github.com/ARC-V2-AI/ARC-V2-Util.git" }
